name: Mise à jour classement PRO D2

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * 4"
    - cron: "0 22 * * 5"


permissions:
  contents: write


jobs:

  update-classement:

    runs-on: ubuntu-latest

    steps:

      - name: Récupération du dépôt
        uses: actions/checkout@v4


      - name: Installation de Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium


      - name: Récupération du classement
        run: |
          python scraper.py


      - name: Enregistrement du classement
        run: |
          git config user.name "Twelve Prono Bot"
          git config user.email "actions@github.com"

          git add classement.json debug_classement.txt

          if git diff --cached --quiet
          then
            echo "Aucune modification du classement."
          else
            git commit -m "Mise à jour automatique du classement"
            git push
          fi
