name: Mise à jour classement PRO D2

on:
  workflow_dispatch:

  schedule:
  #   # Jeudi
  - cron: "12 17 * * 4"  # Jeudi 19h12 France
  - cron: "10 18 * * 4"  # Jeudi 20h10 France
  - cron: "00 19 * * 4"  # Jeudi 20h40 France 23H00github

  # Vendredi
  - cron: "12 16 * * 5" # Vendredi 18h12 France 20Hgithub
  - cron: "12 17 * * 5"  # Vendredi 19h12 France
  - cron: "12 18 * * 5"  # Vendredi 20h12 France
  - cron: "17 19 * * 5"  # Vendredi 21h17  
  - cron: "17 20 * * 5"  # Vendredi 21h17  00Hgithub

permissions:
  contents: write

jobs:
  update-classement:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Récupération du classement
        run: |
          python scraper.py

      - name: Enregistrement du classement
        run: |
          git config user.name "Twelve Prono Bot"
          git config user.email "actions@github.com"

          git add classement.json debug_classement.txt

          if git diff --cached --quiet
          then
            echo "Aucune modification du classement."
          else
            git commit -m "Mise à jour automatique du classement"
            git push
          fi
